apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-qa-web
  labels: {app.kubernetes.io/name: site-qa-web, app.kubernetes.io/part-of: site-qa}
spec:
  # Keep at 1: chat histories and the vector index live in this process's memory
  # (see src/wsgi.py). To scale out you need sticky sessions at the ingress and
  # a ReadWriteMany data volume; histories still won't survive a pod restart.
  replicas: 1
  strategy:
    type: Recreate            # the data volume is ReadWriteOnce
  selector:
    matchLabels: {app.kubernetes.io/name: site-qa-web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: site-qa-web, app.kubernetes.io/part-of: site-qa}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The app indexes the site at start-up, so wait until its inputs exist.
        - name: wait-for-data
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -n "$(find /data -name '*.md' -print -quit)" ]; do
                echo "no staged pages yet; run the site-ingest job"; sleep 5
              done
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
        - name: wait-for-ollama
          image: busybox:1.36
          envFrom:
            - configMapRef: {name: site-qa-config}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Wait for the server AND both models (names appear in /api/tags).
              until wget -qO- "$OLLAMA_URL/api/tags" > /tmp/tags 2>/dev/null \
                    && grep -q "$CHAT_MODEL" /tmp/tags && grep -q "$EMBED_MODEL" /tmp/tags; do
                echo "waiting for ollama and models..."; sleep 5
              done
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
      containers:
        - name: web
          image: site-qa-web:0.1.0
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: site-qa-config}
          env:
            - name: FLASK_SECRET_KEY            # signs session cookies; see README
              valueFrom:
                secretKeyRef: {name: site-qa-secrets, key: flask-secret-key}
          # Indexing embeds every page, so allow up to 10 minutes before liveness applies.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: site-qa-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: site-qa-web
  labels: {app.kubernetes.io/name: site-qa-web, app.kubernetes.io/part-of: site-qa}
spec:
  selector: {app.kubernetes.io/name: site-qa-web}
  ports:
    - {name: http, port: 80, targetPort: http}
