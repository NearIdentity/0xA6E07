apiVersion: v1
kind: Namespace
metadata:
  name: site-qa
  labels:
    # Pod Security Admission: reject pods that need privileges. The ollama pod
    # runs as root (the upstream image does) but needs no extra privileges, so
    # "baseline" is the strictest level that admits every workload here.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
