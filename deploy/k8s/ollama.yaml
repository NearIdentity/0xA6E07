apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: site-qa}
spec:
  replicas: 1
  strategy:
    type: Recreate            # the models volume is ReadWriteOnce
  selector:
    matchLabels: {app.kubernetes.io/name: ollama}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: site-qa}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.35.0       # pinned; bump deliberately (see kustomization.yaml)
          ports:
            - {name: http, containerPort: 11434}
          env:
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_KEEP_ALIVE, value: "30m"}   # keep models loaded between questions
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits:
              memory: 12Gi
              # >>> GPU: requires the NVIDIA device plugin / GPU operator on the cluster.
              # Uncomment to schedule onto a GPU node (CPU-only works but is slow).
              # nvidia.com/gpu: 1
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: ollama-models}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: site-qa}
spec:
  selector: {app.kubernetes.io/name: ollama}
  ports:
    - {name: http, port: 11434, targetPort: http}
