# Pulls the chat and embedding models into the Ollama volume. Safe to re-run:
# models that are already present are not downloaded again. Jobs are immutable,
# so after changing CHAT_MODEL/EMBED_MODEL delete it first:
#   kubectl -n site-qa delete job ollama-pull && kubectl apply -k deploy/k8s
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull
  labels: {app.kubernetes.io/name: ollama-pull, app.kubernetes.io/part-of: site-qa}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama-pull, app.kubernetes.io/part-of: site-qa}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:0.35.0
          envFrom:
            - configMapRef: {name: site-qa-config}
          env:
            - {name: OLLAMA_HOST, value: "http://ollama:11434"}   # talk to the server, don't run one
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 3; done
              ollama pull "$CHAT_MODEL"
              ollama pull "$EMBED_MODEL"
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
